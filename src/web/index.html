<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LHC Rate Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/vendor/plotly.min.js"></script>
</head>
<body>
  <main>
    <h1>LHC Rate Calculator</h1>
    <p class="sub">Event rate, expected events and pile-up for pp collisions.</p>

    <form id="inputs">
      <label>Luminosity <span class="unit">×10³⁴ cm⁻² s⁻¹</span>
        <input name="lumi" value="2" inputmode="decimal"></label>
      <label>Colliding bunches <span class="unit">n<sub>b</sub></span>
        <input name="n_bunches" value="2400" inputmode="numeric"></label>
      <label>Cross-section <span class="unit">σ</span>
        <span class="pair">
          <input name="sigma" value="50" inputmode="decimal">
          <select name="unit">
            <option value="fb">fb</option>
            <option value="pb" selected>pb</option>
            <option value="nb">nb</option>
            <option value="ub">µb</option>
            <option value="mb">mb</option>
          </select>
        </span></label>
      <label>Integrated luminosity <span class="unit">fb⁻¹</span>
        <input name="int_lumi" value="300" inputmode="decimal"></label>
      <button type="submit">Calculate</button>
    </form>

    <p id="error" role="alert" hidden></p>

    <section id="results" aria-live="polite">
      <div class="tile"><span class="label">Event rate <i>R = σL</i></span><span class="value" id="rate">–</span></div>
      <div class="tile"><span class="label">Expected events <i>N = σ∫L dt</i></span><span class="value" id="events">–</span></div>
      <div class="tile"><span class="label">Pile-up <i>μ = σ<sub>inel</sub>L / (n<sub>b</sub>f<sub>rev</sub>)</i></span><span class="value" id="mu">–</span></div>
    </section>

    <div id="plot" aria-label="Pile-up against luminosity"></div>

    <p class="constants" id="constants"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
